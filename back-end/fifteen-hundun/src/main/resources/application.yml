spring:
  profiles:
    active: dev
  application:
    name: fifteen-hundun
  datasource:
    url: ${fifteen-hundun.mysql.url}
    username: ${fifteen-hundun.mysql.username}
    password: ${fifteen-hundun.mysql.password}
    driver-class-name: ${fifteen-hundun.mysql.driver-class-name}
  data:
    redis:
      host: ${fifteen-hundun.redis.host}
      port: ${fifteen-hundun.redis.port}
      password: ${fifteen-hundun.redis.password}
      database: ${fifteen-hundun.redis.database}
      timeout: ${fifteen-hundun.redis.timeout}

## JWT配置（当前直接在JwtUtil.java中硬编码，如需外部配置可启用下方并创建@ConfigurationProperties）
jwt:
   secret: THVvZmVuZ3d1cWkxNWh1bmR1bkp3dFBhc3N3b3JkTG9uZ0Vub3VnaFBsZWFzZQ==
   expiration: 24*60*60*1000
# 自定义用户相关表配置
user:
  related-tables:
    - article_user_interact
    - user_food_finance
    - user_food_health
    - user_memo_common
    - user_memo_important
    - user_model_status
    - user_payment_finance
    - user_sleep_health
    - user_mood_health
    - user_place_health
    - user_place_finance

# 阿里云OSS配置
aliyun:
  endpoint: ${fifteen-hundun.alioss.endpoint}
  access-key-id: ${fifteen-hundun.alioss.access-key-id}
  access-key-secret: ${fifteen-hundun.alioss.access-key-secret}
  bucket-name: ${fifteen-hundun.alioss.bucket-name}
  domain: ${fifteen-hundun.alioss.domain}

# GLM AI配置
glm:
  api-key: ${fifteen-hundun.glm.api-key}
  api-url: ${fifteen-hundun.glm.api-url}
  model: ${fifteen-hundun.glm.model:glm-4}


#mybatis配置
mybatis:
  # 开启驼峰命名自动转换（重点！）
  configuration:
    map-underscore-to-camel-case: true
  # 可选：指定Mapper.xml文件位置（如果用XML写SQL需要配）
  mapper-locations: classpath:com/createpen/fifteenhundun/module/*/mapper/*.xml
  # 可选：指定实体类别名包（简化XML里的类名）
#  type-aliases-package: com.createpen.fifteenhundun.module.user.pojo.Entity

